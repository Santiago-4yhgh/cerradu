<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; background: #1E1E2E; height: 100vh; }
        .login-container { max-width: 400px; background: #FF6B6B; padding: 30px; border-radius: 15px; color: white; text-align: center; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group input { width: 100%; padding: 12px; border-radius: 8px; background: rgba(255, 255, 255, 0.9); }
        .login-btn { width: 100%; padding: 12px; background: #2ECC71; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .register-btn { width: 100%; padding: 12px; background: #FFB400; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Iniciar sesión</h1>
        <form id="login-form">
            <div class="form-group"><label>Correo</label><input type="email" id="login-email" required></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="login-password" required></div>
            <button type="submit" class="login-btn">Entrar</button>
        </form>
        <div id="error-message" style="color: rgb(255, 255, 255); display: none;">Credenciales incorrectas</div>
        <button onclick="window.location.href='for.html'" class="register-btn">¿No tienes cuenta? Regístrate aquí</button>
    </div>

    <script>
        // Manejar el inicio de sesión
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();

            // Obtener los datos del formulario
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            // Recuperar los datos almacenados en localStorage
            const storedEmail = localStorage.getItem('userEmail');
            const storedPassword = localStorage.getItem('userPassword');

            // Verificar si el correo y la contraseña coinciden
            if (email === storedEmail && password === storedPassword) {
                alert('Bienvenido!');
                window.location.href = 'Login.html';  // Redirige a la página principal o dashboard
            } else {
                document.getElementById('error-message').style.display = 'block';  // Mostrar mensaje de error
            }
        });
    </script>
</body>
</html>
